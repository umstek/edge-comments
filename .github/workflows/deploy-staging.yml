name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy Staging
    environment:
      name: staging
      url: https://comments.staging.umstek.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cache worker-build
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-worker-build-0.9.0
      - name: Install worker-build
        run: |
          if ! worker-build --version 2>/dev/null | grep -q '0\.9\.0'; then
            cargo install -q worker-build --version 0.9.0 --locked --force
          fi
      - name: Build Worker (staging)
        run: npm run build:cf:staging
        env:
          CF_D1_ID: ${{ secrets.CF_D1_STAGING_ID }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ALLOWED_SITES: ${{ vars.ALLOWED_SITES }}
      - name: Apply D1 migrations (staging)
        run: npx cf d1 migrations apply "$CF_D1_ID" --dir ./migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_STAGING_ID }}
      - name: Deploy to Cloudflare (staging)
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
