name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CF_SEND_TELEMETRY: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache worker-build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-worker-build-0.8.7
      - name: Install worker-build
        run: command -v worker-build || cargo install -q worker-build --version 0.8.7 --locked
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: WASM build & cf deploy dry-run
        run: npm run deploy:dry-run
      - name: Migration SQL
        run: |
          for f in migrations/*.sql; do
            sqlite3 /tmp/edge-comments.db < "$f"
            sqlite3 /tmp/edge-comments.db < "$f"
          done
