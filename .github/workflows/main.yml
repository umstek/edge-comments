name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v7
      - run: mv wrangler.example.toml wrangler.toml
      - name: Fill in KV namespace id
        run: sed -i 's/00000000000000000000000000000000/${{ secrets.CF_KV_ID }}/g' wrangler.toml
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Publish
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
