name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: mv wrangler.example.toml wrangler.toml
      - name: Fill in the D1 database id
        run: sed -i 's/00000000-0000-0000-0000-000000000000/${{ secrets.CF_D1_ID }}/g' wrangler.toml
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Publish
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          preCommands: wrangler d1 migrations apply edge-comments --remote
