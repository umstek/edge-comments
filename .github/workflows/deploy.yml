name: Deploy to Cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    environment:
      name: production
      url: https://comments.umstek.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cache worker-build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-worker-build-0.8.7
      - name: Install worker-build
        run: command -v worker-build || cargo install -q worker-build --version 0.8.7 --locked
      - name: Build Worker (production)
        run: npm run build:cf
        env:
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ALLOWED_SITES: ${{ vars.ALLOWED_SITES }}
      - name: Apply D1 migrations (production)
        run: npx cf d1 migrations apply "$CF_D1_ID" --dir ./migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
      - name: Deploy to Cloudflare (production)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
