[package]
name = "edge-comments"
version = "0.3.0"
authors = ["Wickramaranga Abeygunawardhana <w@umstek.tk>"]
edition = "2024"
license = "MIT"
description = "Convention-based comments engine on Cloudflare Workers D1, written in Rust"
repository = "https://github.com/umstek/edge-comments"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
url = "2"
uuid = { version = "1.29", features = ["v4", "v7", "serde", "js"] }
worker = { version = "0.8.7", features = ["d1"] }

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
